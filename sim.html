<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado, Professor!</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .thanks-box {
            max-width: 700px;
            margin: 4rem auto;
            background: white;
            padding: 2rem;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #d4af37;
            font-size: 2rem;
        }
        .btn-gold {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.8rem 2rem;
            background: #d4af37;   /* ➜ COR DE FUNDO APLICADA */
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .btn-gold:hover {
            background: #b8922b;
        }
    </style>
</head>

<body>
    <div class="thanks-box">
        <h2>OBRIGADO, PROFESSOR ÍTALO! 🎓</h2>
        <p>A turma 923 agradece imensamente por aceitar ser nosso padrinho. Sua presença torna nossa jornada ainda mais
            especial.</p>
        <a href="index.html" class="btn-gold">Voltar ao início :D</a>
    </div>
</body>
</html>
