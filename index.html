<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Sistema</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
            font-family: 'Outfit', sans-serif;
        }

        .login-box {
            width: 330px;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 1rem;
            color: #d4af37;
        }

        .login-box input {
            width: 100%;
            padding: 0.8rem;
            margin: 0.5rem 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        .login-btn {
            width: 100%;
            padding: 0.8rem;
            background: #d4af37;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #b8922b;
        }

        .error-text {
            margin-top: 1rem;
            color: red;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>Acesso Restrito</h2>
        <input type="text" id="user" placeholder="Usuário">
        <input type="password" id="pass" placeholder="Senha">
        <button class="login-btn" id="login">Entrar</button>
        <p class="error-text" id="error">Erro inesperado: 0x00FATAL — tente novamente.</p>
    </div>

    <script>
        const btn = document.getElementById('login');
        const errorText = document.getElementById('error');

        btn.addEventListener('click', () => {
            errorText.style.display = 'block';

            setTimeout(() => {
                window.location.href = "suatrajetoria.html";
            }, 2200);
        });
    </script>
</body>
</html>
